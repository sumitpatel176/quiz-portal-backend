
spring.application.name=quiz
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.org.springframework.security.web=${LOG_LEVEL:INFO}


app.jwt.secret=${JWT_SECRET}

# 2. Access Token Expiry (15 Minutes = 900000 ms)
app.jwt.accessTokenExpirationMs=900000

# 3. Refresh Token Expiry (7 Days = 604800000 ms)
app.jwt.refreshTokenExpirationMs=604800000

# 4. Cookie Configuration (Production / HTTPS Standard)
app.jwt.cookieName=refreshTokenz

app.frontend.url=${FRONTEND_URL}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}